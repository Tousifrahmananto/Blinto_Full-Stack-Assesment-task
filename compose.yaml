services:
  backend:
    build: ./backend
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/movies', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${DOOMSDAY_PORT:-4173}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
